server {
    listen 80;
    listen [::]:80;
    server_name i8k.alonglfb.com nav.alonglfb.com;

    # ACME challenge support (Let's Encrypt 证书验证)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    # 强制重定向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    # 若直接监听外网 443 端口，可开启下方两行：
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name i8k.alonglfb.com nav.alonglfb.com;

    # SSL 证书配置 (复用 SA1 泛域名证书)
    ssl_certificate /etc/nginx/ssl/*.alonglfb.com_alonglfb.com_EC256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/*.alonglfb.com_alonglfb.com_EC256/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头 (Security Headers)
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip 压缩传输
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 请求体限制（支持后台 Logo 与图片上传）
    client_max_body_size 20M;

    # 拦截所有敏感与隐藏文件探测（如 .git, .env, .dockerignore 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Next.js 静态构建产物长期缓存加速
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 反向代理到 i8k-nav 容器 (端口 3026)
    location / {
        proxy_pass http://127.0.0.1:3026;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
